<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef2f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12161c" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Budget">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Budget</title>
<style>
:root{--bg:#eef2f8;--card:#fff;--tx:#1f2937;--mu:#6b7686;--ac:#1a73e8;--acs:#e8f0fe;--in:#188038;--out:#d93025;--sv:#e37400;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1d232c;--tx:#e8ecf2;--mu:#98a3b3;--ac:#8ab4f8;--acs:#26334a;--in:#81c995;--out:#f28b82;--sv:#fdd663}}
:root[data-theme="dark"]{--bg:#12161c;--card:#1d232c;--tx:#e8ecf2;--mu:#98a3b3;--ac:#8ab4f8;--acs:#26334a;--in:#81c995;--out:#f28b82;--sv:#fdd663}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Poppins","Segoe UI",Roboto,system-ui,sans-serif;font-size:14px}
button,input,select{font:inherit;color:inherit}
#app{max-width:480px;margin:0 auto;padding:16px 16px 150px}
h1{font-size:19px;font-weight:500;margin:6px 4px 14px}
.card{background:var(--card);border-radius:24px;padding:18px;margin-bottom:12px}
.mu{color:var(--mu);font-size:12px}
.big{font-size:27px;font-weight:500;letter-spacing:-.5px;margin:4px 0 2px}
.neg{color:var(--out)}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.head b{font-weight:500;font-size:15px;text-transform:capitalize}
.nav{display:flex;gap:8px}
.nav button{width:36px;height:36px;border:0;border-radius:50%;background:var(--bg);cursor:pointer;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.dw{font-size:12px;color:var(--mu);padding:6px 0}
.d{border:0;background:none;border-radius:14px;height:52px;display:flex;flex-direction:column;align-items:center;padding-top:5px;gap:2px;cursor:pointer}
.d .n{font-size:13px;width:26px;height:26px;line-height:26px;border-radius:50%}
.d.today .n{background:var(--acs);color:var(--ac);font-weight:600}
.d.sel{background:var(--acs)}
.d.sel .n{background:var(--ac);color:var(--card)}
.d .b{font-size:9px;color:var(--mu)}
.d .b.neg{color:var(--out)}
.row{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;padding:10px 0;cursor:pointer}
.ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--bg)}
.ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.row .t{flex:1;min-width:0}
.row .t div:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .a{font-weight:500;white-space:nowrap}
.link{border:0;background:none;color:var(--ac);padding:8px;margin:0 auto;display:block;cursor:pointer}
#fab{position:fixed;right:max(20px,calc(50% - 220px));bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:5}
#fab>button{width:54px;height:54px;border:0;border-radius:50%;background:var(--ac);color:var(--card);font-size:28px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.2)}
#menu{position:absolute;right:0;bottom:70px;background:var(--card);border-radius:20px;padding:6px;min-width:200px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
#menu button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:12px;border-radius:14px;cursor:pointer;text-align:left}
#menu button:active{background:var(--bg)}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:10;display:flex;align-items:flex-end;justify-content:center}
#ov.center{align-items:center;padding:20px}
#sh{background:var(--card);width:100%;max-width:480px;border-radius:28px 28px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));max-height:92%;overflow-y:auto}
#ov.center #sh{border-radius:28px}
#sh h2{font-size:17px;font-weight:500;margin:0 0 14px}
.seg{display:flex;background:var(--bg);border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:10px 4px;border-radius:11px;cursor:pointer}
.seg button.on{background:var(--card);font-weight:500}
label{display:block;font-size:12px;color:var(--mu);margin:0 0 4px 4px}
.f input,.f select{width:100%;border:0;background:var(--bg);border-radius:14px;padding:14px;margin-bottom:12px;appearance:none;-webkit-appearance:none;min-height:50px}
.btns{display:flex;gap:10px;margin-top:4px}
.btns button{flex:1;border:0;border-radius:14px;padding:14px;cursor:pointer;background:var(--bg)}
.btns .ok{background:var(--ac);color:var(--card);font-weight:500;flex:2}
.btns .del{color:var(--out)}
.grid{touch-action:pan-y}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:4;background:var(--card);display:flex;justify-content:center;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px))}
#tabs>div{display:flex;width:100%;max-width:480px}
#tabs button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mu);cursor:pointer;padding:2px 0}
#tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;padding:4px 18px;box-sizing:content-box;border-radius:14px}
#tabs button.on{color:var(--ac);font-weight:500}
#tabs button.on svg{background:var(--acs)}
.accs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.acc{background:var(--card);border:0;border-radius:24px;padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.lst{display:flex;justify-content:space-between;padding:10px 0}
.nav .tdy{width:auto;border-radius:18px;padding:0 12px;font-size:12px;color:var(--ac);background:var(--acs)}
.gear{width:40px;height:40px;border:0;border-radius:50%;background:var(--card);color:var(--tx);display:grid;place-items:center;cursor:pointer}
.gear svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.btns[style*=column] button{flex:none}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="app"></div>
<nav id="tabs"><div>
<button data-p="budget"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Budget</button>
<button data-p="analyse"><svg viewBox="0 0 24 24"><path d="M6 20V11M12 20V5M18 20v-6"/></svg>Analyse</button>
<button data-p="epargne"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>Epargne</button>
</div></nav>
<div id="fab"><div id="menu" hidden></div><button id="plus" aria-label="Nouvelle transaction">+</button></div>
<div id="ov" hidden><div id="sh"></div></div>
<script>
const K='budget.v1',$=s=>document.querySelector(s);
const T={recette:{n:'Recette',s:1,c:'var(--in)',i:'<path d="M12 5v14M6 13l6 6 6-6"/>'},
depense:{n:'Dépense',s:-1,c:'var(--out)',i:'<path d="M12 19V5M6 11l6-6 6 6"/>'},
epargne:{n:'Épargne',s:-1,c:'var(--sv)',i:'<circle cx="12" cy="12" r="8"/><path d="M12 8v8M9 12h6"/>'}};
const REC={none:'Aucune',week:'Chaque semaine',month:'Chaque mois',year:'Chaque année'};
let S=null;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const eur=n=>n.toLocaleString('fr-FR',{style:'currency',currency:'EUR'});
const short=n=>{const a=Math.abs(n);return a>=1000?(n/1000).toFixed(1).replace('.',',').replace(',0','')+'k':Math.round(n)+''};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const today=iso(new Date());
let view=new Date(new Date().getFullYear(),new Date().getMonth(),1),sel=today,F=null,P='budget',sview=new Date(view),sbar=0;

function occ(t,end){
  const out=[];
  if(t.rec==='none'){if(t.date<=end)out.push(t.date);return out}
  const b=parse(t.date),lim=t.until&&t.until<end?t.until:end,step=t.rec==='month'?1:12;
  for(let n=0;n<1500;n++){
    let d;
    if(t.rec==='week')d=new Date(b.getFullYear(),b.getMonth(),b.getDate()+7*n);
    else{d=new Date(b.getFullYear(),b.getMonth()+step*n,1);
      d.setDate(Math.min(b.getDate(),new Date(d.getFullYear(),d.getMonth()+1,0).getDate()))}
    const s=iso(d);if(s>lim)break;out.push(s)
  }
  return t.skip?out.filter(d=>!t.skip.includes(d)):out;
}
function calc(end){
  const ev=[];
  S.tx.forEach(t=>occ(t,end).forEach(date=>{if(date>=S.startDate)ev.push({date,t,eff:T[t.type].s*t.amount})}));
  ev.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  let run=S.start;const map={};
  ev.forEach(e=>{run+=e.eff;e.run=run;map[e.date]=run});
  return{ev,map,run};
}

const ml=d=>d.toLocaleDateString('fr-FR',{month:'narrow'});
const mlong=d=>d.toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
const sumv=p=>Object.values(p).reduce((a,b)=>a+b,0);
function monthsFrom(d0,n){return Array.from({length:n},(_,i)=>{const d=new Date(d0.getFullYear(),d0.getMonth()+i,1);return{d,end:iso(new Date(d.getFullYear(),d.getMonth()+1,0))}})}
function savAt(end){const per={};S.acc.forEach(a=>per[a.id]=a.start);
  S.tx.forEach(t=>{const k=t.type==='epargne'?t.acc:t.type==='recette'?t.from:null,sg=t.type==='epargne'?1:-1;if(k&&per[k]!==undefined)occ(t,end).forEach(d=>{if(d>=S.startDate)per[k]+=sg*t.amount})});return per}
function head(t){return `<div class="head" style="margin-bottom:12px"><h1 style="margin:6px 4px">${t}</h1><button class="gear" data-set="1" aria-label="Réglages"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button></div>`}
function go(n){view=new Date(view.getFullYear(),view.getMonth()+n,1);sel=iso(view).slice(0,7)===today.slice(0,7)?today:iso(view);render()}
function render(){
  if(!S){setup();return}
  S.acc=S.acc||[];$('#fab').hidden=P!=='budget';document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.p===P));
  ({budget:renderBudget,analyse:renderAnalyse,epargne:renderEpargne})[P]();
}
function renderAnalyse(){
  const ms=monthsFrom(new Date(),12),{ev}=calc(ms[11].end);
  const v=ms.map(m=>{let b=S.start;ev.forEach(e=>{if(e.date<=m.end)b=e.run});return b});
  const mn=Math.min(...v,0);let mx=Math.max(...v,0);if(mx===mn)mx=mn+1;
  const X=i=>14+i*26.5,Y=n=>10+(mx-n)/(mx-mn)*110;
  const svg=`<svg viewBox="0 0 320 140" style="width:100%;display:block">
  ${v.map((n,i)=>{const y0=Y(0),y1=Y(n);return `<rect x="${X(i)-9}" y="${Math.min(y0,y1)}" width="18" height="${Math.max(2,Math.abs(y1-y0))}" rx="5" fill="${n<0?'var(--out)':'var(--ac)'}"/><text x="${X(i)}" y="136" text-anchor="middle" font-size="9" fill="var(--mu)">${ml(ms[i].d)}</text>`}).join('')}</svg>`;
  $('#app').innerHTML=head('Analyse')+`<div class="card"><div class="mu" style="margin-bottom:8px">Solde de fin de mois, 12 mois</div>${svg}</div>
  <div class="card">${ms.map((m,i)=>`<div class="lst"><span style="text-transform:capitalize">${mlong(m.d)}</span><span class="${v[i]<0?'neg':''}" style="font-weight:500">${eur(v[i])}</span></div>`).join('')}</div>`;
}
function renderEpargne(){
  const ms=monthsFrom(sview,12),pers=ms.map(m=>savAt(m.end)),t=pers.map(sumv),mx=Math.max(...t,1),cur=pers[sbar];
  const bars=t.map((n,i)=>{const h=n/mx*100;return `<g data-bar="${i}" style="cursor:pointer"><rect x="${i*26.5+2}" y="0" width="26" height="136" fill="transparent"/><rect x="${i*26.5+6}" y="${112-h}" width="18" height="${Math.max(h,2)}" rx="5" fill="var(--sv)" opacity="${i===sbar?1:.45}"/><text x="${i*26.5+15}" y="130" text-anchor="middle" font-size="9" fill="var(--mu)">${ml(ms[i].d)}</text></g>`}).join('');
  const accs=S.acc.map(a=>{const b=cur[a.id],p=a.goal>0?Math.max(0,Math.min(1,b/a.goal)):0;
    return `<button class="acc" data-acc="${a.id}"><svg viewBox="0 0 64 64" width="64" height="64"><circle cx="32" cy="32" r="26" fill="none" stroke="var(--bg)" stroke-width="7"/>
    <circle cx="32" cy="32" r="26" fill="none" stroke="var(--sv)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${p*163.4} 163.4" transform="rotate(-90 32 32)"/>
    <text x="32" y="36" text-anchor="middle" font-size="13" fill="var(--tx)">${Math.round(p*100)}%</text></svg>
    <div style="font-weight:500">${esc(a.name)}</div><div>${eur(b)}</div><div class="mu">${a.goal>0?'Objectif '+eur(a.goal):'Sans objectif'}</div></button>`}).join('');
  $('#app').innerHTML=head('Epargne')+`<div class="card"><div class="head"><div><div class="mu">Épargne totale, fin <span style="text-transform:capitalize">${mlong(ms[sbar].d)}</span></div><div class="big">${eur(t[sbar])}</div></div>
  <div class="nav"><button data-snav="-1" aria-label="Mois précédent">‹</button><button data-snav="1" aria-label="Mois suivant">›</button></div></div></div>
  <div class="card"><div class="mu" style="margin-bottom:8px">Épargne totale sur 12 mois</div><svg viewBox="0 0 320 136" style="width:100%;display:block">${bars}</svg></div>
  <div class="accs">${accs}</div>${S.acc.length?'':'<p class="mu" style="text-align:center">Créez un compte d\'épargne pour suivre vos objectifs.</p>'}
  <button class="link" id="newacc">+ Nouveau compte d'épargne</button>`;
}
function openAcc(id){
  const a=id?S.acc.find(x=>x.id===id):{name:'',start:'',goal:''};F={accId:id||null};
  open(`<h2>${id?'Modifier le compte':'Nouveau compte d\'épargne'}</h2><div class="f"><label>Nom</label><input name="an" placeholder="Ex. Vacances" value="${esc(a.name)}">
  <label>Solde de départ (€)</label><input name="as" inputmode="decimal" placeholder="0,00" value="${a.start===''?'':String(a.start).replace('.',',')}">
  <label>Objectif à atteindre (€)</label><input name="ag" inputmode="decimal" placeholder="Facultatif" value="${a.goal?String(a.goal).replace('.',','):''}"></div>
  <div class="btns">${id?'<button class="del" id="delacc">Supprimer</button>':''}<button class="ok" id="okacc">Enregistrer</button></div>`);
}
function saveAcc(){
  const q=n=>$('#sh [name='+n+']'),num=n=>parseFloat(q(n).value.replace(/\s/g,'').replace(',','.'));
  const name=q('an').value.trim();if(!name){q('an').focus();return}
  const a={id:F.accId||'a'+Date.now(),name,start:num('as')||0,goal:num('ag')||0};
  S.acc=F.accId?S.acc.map(x=>x.id===a.id?a:x):[...S.acc,a];save();close();render();
}
function renderBudget(){
  const y=view.getFullYear(),m=view.getMonth(),last=new Date(y,m+1,0),endS=iso(last);
  const {ev,map,run}=calc(endS);
  const mname=view.toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
  const lead=(view.getDay()+6)%7;
  let cells='';
  for(let i=0;i<lead;i++)cells+='<span></span>';
  for(let d=1;d<=last.getDate();d++){
    const ds=iso(new Date(y,m,d)),b=map[ds];
    cells+=`<button class="d${ds===today?' today':''}${ds===sel?' sel':''}" data-d="${ds}"><span class="n">${d}</span><span class="b${b<0?' neg':''}">${b===undefined?'':short(b)}</span></button>`;
  }
  const day=ev.filter(e=>e.date===sel);
  let before=S.start;ev.forEach(e=>{if(e.date<=sel)before=e.run});
  const selLabel=parse(sel).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
  const rows=day.map(e=>{const t=e.t,c=T[t.type];
    return `<button class="row" data-id="${t.id}" data-od="${e.date}"><span class="ic" style="color:${c.c}"><svg viewBox="0 0 24 24">${c.i}</svg></span>
    <span class="t"><div>${esc(t.label)}</div><div class="mu">${c.n}${t.rec!=='none'?' · '+REC[t.rec].toLowerCase():''}</div></span>
    <span class="a" style="color:${c.c}">${c.s>0?'+':'−'}${eur(t.amount)}</span></button>`}).join('');
  $('#app').innerHTML=`
  ${head('Budget')}
  <div class="card"><div class="mu">Solde fin ${new Date(y,m,1).toLocaleDateString('fr-FR',{month:'long'})}${endS>today?' (prévisionnel)':''}</div>
    <div class="big${run<0?' neg':''}">${eur(run)}</div></div>
  <div class="card"><div class="head"><b>${mname}</b><div class="nav">${iso(view).slice(0,7)!==today.slice(0,7)?'<button class="tdy" data-today="1">Aujourd\'hui</button>':''}<button data-nav="-1" aria-label="Mois précédent">‹</button><button data-nav="1" aria-label="Mois suivant">›</button></div></div>
    <div class="grid">${['L','M','M','J','V','S','D'].map(x=>`<span class="dw">${x}</span>`).join('')}${cells}</div></div>
  <div class="card"><div class="head"><b style="text-transform:none">${selLabel}</b><span class="mu${before<0?' neg':''}">Solde ${eur(before)}</span></div>
    ${rows||'<p class="mu" style="margin:8px 0">Aucune transaction ce jour. Appuyez sur + pour en ajouter une.</p>'}</div>`;
}

let skipPop=false,shPush=false,pgPush=false;
const hpush=()=>{try{history.pushState({b:1},'');return true}catch(e){return false}};
const hback=()=>{skipPop=true;try{history.back()}catch(e){skipPop=false}};
addEventListener('popstate',()=>{
  if(skipPop){skipPop=false;return}
  if(shPush){shPush=false;$('#ov').hidden=true;F=null;return}
  if(pgPush){pgPush=false;P='budget';render()}
});
function open(html,center){$('#sh').innerHTML=html;if($('#ov').hidden&&S&&!shPush&&hpush())shPush=true;$('#ov').hidden=false;$('#ov').className=center?'center':''}
function close(){$('#ov').hidden=true;F=null;if(shPush){shPush=false;hback()}}

function setup(){
  open(`<h2>Bienvenue</h2><p class="mu" style="margin:0 0 14px">Indiquez votre solde actuel pour calculer vos prévisions des mois à venir.</p>
  <div class="f"><label>Solde de départ (€)</label><input id="sb" inputmode="text" placeholder="0,00 (négatif possible : -150)" value="${S?String(S.start).replace('.',','):''}"><label>Date de ce solde</label><input type="date" id="sd" value="${S?S.startDate:today}"></div>
  <div class="btns">${S?'<button id="cx">Annuler</button>':''}<button class="ok" id="sbok">${S?'Enregistrer':'Commencer'}</button></div>`,true);
}

function openForm(type,id,od){
  const t=id?{...S.tx.find(x=>x.id===id)}:{type,date:sel,label:'',amount:'',rec:'none',until:'',acc:(S.acc[0]||{}).id||''};
  F={id,type:t.type,od};if(id&&od&&t.rec!=='none')t.date=od;
  const fromh=`<div id="fromw" ${F.type==='recette'?'':'hidden'}><label style="display:flex;align-items:center;gap:10px;margin:0 0 12px 4px;font-size:13px;color:var(--tx)"><input type="checkbox" name="fromchk" ${t.from?'checked':''} style="appearance:auto;-webkit-appearance:auto;width:20px;height:20px;min-height:0;padding:0;margin:0;accent-color:var(--ac)">Cette recette vient d'un compte d'épargne</label>
  ${S.acc.length?`<div id="fromsel" ${t.from?'':'hidden'}><label>Compte débité</label><select name="from">${S.acc.map(a=>`<option value="${a.id}"${a.id===t.from?' selected':''}>${esc(a.name)}</option>`).join('')}</select></div>`:'<div class="mu" style="margin:-6px 0 12px 4px">Aucun compte d\'épargne : créez-en un dans l\'onglet Epargne.</div>'}</div>`;
  const acch=`<div id="accw" ${F.type==='epargne'?'':'hidden'}><label>Compte d'épargne</label><select name="acc"><option value="">Aucun compte</option>${S.acc.map(a=>`<option value="${a.id}"${a.id===t.acc?' selected':''}>${esc(a.name)}</option>`).join('')}</select></div>`;
  open(`<h2>${id?'Modifier la transaction':'Nouvelle transaction'}</h2>
  <div class="seg">${Object.keys(T).map(k=>`<button data-type="${k}" class="${k===F.type?'on':''}">${T[k].n}</button>`).join('')}</div>
  <div class="f"><label>Date</label><input type="date" name="date" value="${t.date}">
  <label>Libellé</label><input name="label" placeholder="Ex. Courses" value="${esc(t.label)}">
  <label>Montant (€)</label><input name="amount" inputmode="decimal" placeholder="0,00" value="${t.amount===''?'':String(t.amount).replace('.',',')}">
  <label>Récurrence</label><select name="rec">${Object.keys(REC).map(k=>`<option value="${k}"${k===t.rec?' selected':''}>${REC[k]}</option>`).join('')}</select>
  <div id="unt" ${t.rec==='none'?'hidden':''}><label>Jusqu'au</label><input type="date" name="until" value="${t.until}"></div>${acch}${fromh}</div>
  <div class="btns">${id?'<button class="del" id="del">Supprimer</button>':''}<button class="ok" id="okf">Enregistrer</button></div>`);
}
function saveForm(){
  const q=n=>$('#sh [name='+n+']');
  const amount=parseFloat(q('amount').value.replace(/\s/g,'').replace(',','.'));
  if(!(amount>0)){q('amount').focus();return}
  const date=q('date').value;if(!date){q('date').focus();return}
  const rec=q('rec').value,until=q('until').value;
  if(rec!=='none'&&(!until||until<date)){q('until').focus();return}
  const t={id:F.id||String(Date.now()),type:F.type,date,label:q('label').value.trim()||T[F.type].n,amount,rec,until:rec==='none'?'':until,acc:F.type==='epargne'?q('acc').value:'',from:F.type==='recette'&&q('fromchk').checked?(q('from')||{}).value||'':''};
  if(F.id&&F.od){const o=S.tx.find(x=>x.id===F.id);if(o&&o.rec!=='none'){pend={act:'edit',t};askScope('edit');return}}
  S.tx=F.id?S.tx.map(x=>x.id===F.id?t:x):[...S.tx,t];
  save();const d=parse(date);sel=date;view=new Date(d.getFullYear(),d.getMonth(),1);close();render();
}

let pend=null;
function askScope(act){open(`<h2>${act==='del'?'Supprimer':'Modifier'} une transaction récurrente</h2><div class="btns" style="flex-direction:column"><button data-sc="one">Cette date uniquement</button><button data-sc="next">Cette date et les suivantes</button><button id="cx">Annuler</button></div>`)}
function applyScope(sc){
  const old=S.tx.find(x=>x.id===F.id),od=F.od,act=pend.act,nt=pend.t,u='x'+Date.now();
  const pd=parse(od),prev=iso(new Date(pd.getFullYear(),pd.getMonth(),pd.getDate()-1));
  if(sc==='one'){old.skip=[...(old.skip||[]),od];if(act==='edit')S.tx.push({...nt,id:u,rec:'none',until:''})}
  else{if(od<=old.date)S.tx=S.tx.filter(x=>x!==old);else old.until=prev;if(act==='edit')S.tx.push({...nt,id:u})}
  save();if(act==='edit'){const d=parse(nt.date);sel=nt.date;view=new Date(d.getFullYear(),d.getMonth(),1)}
  close();render();
}
function openSet(){F={set:1};open(`<h2>Réglages</h2><div class="f"><label>Solde de départ (€)</label><input id="sb" inputmode="text" placeholder="Négatif possible : -150" value="${String(S.start).replace('.',',')}"><label>Date de ce solde</label><input type="date" id="sd" value="${S.startDate}"></div>
  <label>Données</label><div class="btns" style="margin-bottom:12px"><button id="dl">Sauvegarder</button><button id="rs">Restaurer</button></div><input type="file" id="rf" accept=".json,application/json" hidden>
  <div class="btns"><button id="cx">Fermer</button><button class="ok" id="sbok">Enregistrer</button></div>`)}
function dl(){const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='budget-sauvegarde-'+today+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}
function restore(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(typeof d.start!=='number'||typeof d.startDate!=='string'||!Array.isArray(d.tx))throw 0;
  if(!confirm('Remplacer toutes les données actuelles par cette sauvegarde ?'))return;S=d;S.acc=S.acc||[];save();close();render()}catch(e){alert('Fichier de sauvegarde invalide.')}};r.readAsText(f)}
let ty=null,tx0=0;
document.addEventListener('touchstart',e=>{if(e.target.closest('.grid')){ty=e.touches[0].clientY;tx0=e.touches[0].clientX}else ty=null},{passive:true});
document.addEventListener('touchend',e=>{if(ty===null)return;const t=e.changedTouches[0],dy=t.clientY-ty,dx=t.clientX-tx0;ty=null;
  if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy))go(dx<0?1:-1)},{passive:true});
document.addEventListener('click',e=>{
  const c=e.target.closest('button,#ov,[data-bar]');if(!c)return;
  if(!$('#menu').hidden&&c.id!=='plus'&&!c.dataset.new)$('#menu').hidden=true;
  if(c.id==='plus'){$('#menu').hidden=!$('#menu').hidden;
    $('#menu').innerHTML=Object.keys(T).map(k=>`<button data-new="${k}"><span class="ic" style="color:${T[k].c}"><svg viewBox="0 0 24 24">${T[k].i}</svg></span>Nouvelle ${T[k].n.toLowerCase()}</button>`).join('');return}
  if(c.dataset.new){$('#menu').hidden=true;openForm(c.dataset.new)}
  else if(c.dataset.d){sel=c.dataset.d;render()}
  else if(c.dataset.bar!==undefined){sbar=Number(c.dataset.bar);render()}
  else if(c.dataset.today){view=new Date(new Date().getFullYear(),new Date().getMonth(),1);sel=today;render()}
  else if(c.dataset.nav)go(Number(c.dataset.nav));
  else if(c.dataset.snav){sview=new Date(sview.getFullYear(),sview.getMonth()+Number(c.dataset.snav),1);sbar=0;render()}
  else if(c.dataset.p){const n=c.dataset.p;if(n!==P){if(n==='budget'){if(pgPush){pgPush=false;hback()}}else if(!pgPush&&hpush())pgPush=true;P=n;window.scrollTo(0,0);render()}}
  else if(c.dataset.acc)openAcc(c.dataset.acc);
  else if(c.id==='newacc')openAcc();
  else if(c.id==='okacc')saveAcc();
  else if(c.id==='delacc'){if(confirm('Supprimer ce compte d\'épargne ?')){S.acc=S.acc.filter(x=>x.id!==F.accId);save();close();render()}}
  else if(c.dataset.id)openForm(null,c.dataset.id,c.dataset.od);
  else if(c.dataset.type){F.type=c.dataset.type;document.querySelectorAll('#sh .seg button').forEach(b=>b.classList.toggle('on',b===c));$('#accw').hidden=F.type!=='epargne';$('#fromw').hidden=F.type!=='recette'}
  else if(c.id==='okf')saveForm();
  else if(c.dataset.sc)applyScope(c.dataset.sc);
  else if(c.id==='del'){const o=S.tx.find(x=>x.id===F.id);
    if(o&&o.rec!=='none'&&F.od){pend={act:'del'};askScope('del')}
    else if(confirm('Supprimer cette transaction ?')){S.tx=S.tx.filter(x=>x.id!==F.id);save();close();render()}}
  else if(c.dataset.set)openSet();
  else if(c.id==='dl')dl();
  else if(c.id==='rs')$('#rf').click();
  else if(c.id==='cx')close();
  else if(c.id==='sbok'){
    const v=parseFloat($('#sb').value.replace(/\s/g,'').replace('−','-').replace(',','.')),sd=$('#sd').value||today;if(isNaN(v)){$('#sb').focus();return}
    if(S){S.start=v;S.startDate=sd}else S={start:v,startDate:sd,tx:[],acc:[]};
    save();close();render()}
  else if(e.target.id==='ov'&&S&&F)close();
});
document.addEventListener('change',e=>{
  if(e.target.id==='rf'){restore(e.target.files[0]);return}
  if(e.target.name==='fromchk'){const f=$('#fromsel');if(f)f.hidden=!e.target.checked;return}
  if(e.target.name!=='rec')return;
  const r=e.target.value,u=$('#sh [name=until]');$('#unt').hidden=r==='none';
  if(r!=='none'&&!u.value){const d=parse($('#sh [name=date]').value||today);d.setFullYear(d.getFullYear()+1);u.value=iso(d)}
});
render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
